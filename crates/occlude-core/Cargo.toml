[package]
name = "occlude-core"
version = "0.1.0"
edition = "2021"
description = "Exact hidden-line-removal geometry core for pen plotters"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["parallel", "contour-sdf"]
parallel = ["rayon"]
wasm = ["wasm-bindgen"]
cull-debug = []
profile = []
# Analytic distance contours. Disable default features to compare the retained offset engine.
contour-sdf = ["dep:boostvoronoi", "dep:getrandom", "dep:js-sys"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
rayon = { version = "1.10", optional = true }
cavalier_contours = "=0.9.0"
i_overlay = "=8.1.1"
earcut = "=0.4.11"
robust = "=1.2.0"

boostvoronoi = { version = "=0.12.1", default-features = false, optional = true }
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }
js-sys = { version = "=0.3.104", optional = true }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "geometry"
harness = false
