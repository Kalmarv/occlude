<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Occlude · 3D visibility laboratory</title></head>
<body><main><h1>3D visibility laboratory</h1><p>Explore mesh edges and hidden lines. Feature filters reuse the computed visibility.</p><div class="controls"><label>Scene <select id="scene"><option value="triangle">Analytic triangle</option><option value="box">Box</option><option value="overlap">Crossing boxes and wire</option><option value="relief">Extruded and deformed grid</option></select></label><label>Orbit <input id="orbit" type="range" min="0" max="360" value="35"></label><label>Features <select id="features"><option value="all">All features</option><option value="silhouette">Silhouettes</option><option value="marked">Marked edges</option></select></label><label>Projection <select id="projection"><option value="orthographic">Orthographic</option><option value="perspective">Perspective</option></select></label><button id="run">Compute visibility</button><button id="cancel">Cancel render</button><button id="restart">Restart worker</button><button id="download" disabled>Download SVG</button></div><p id="status" role="status">Preparing WebGPU…</p><section><article><h2>Construction preview</h2><canvas id="viewport" width="720" height="480"></canvas></article><article><h2>Committed vectors</h2><div id="vectors"></div></article></section><details open><summary>Verification evidence</summary><pre id="evidence"></pre></details></main><script type="module" src="/src/three-lab.ts"></script></body></html>
