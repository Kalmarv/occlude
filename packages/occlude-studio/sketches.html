<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>occlude sketches</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="shell-body">
    <aside id="side"></aside>
    <main id="sketches-main" class="page">
      <div class="page-head">
        <div><h1>Sketches</h1><div class="sub" id="sketches-sub"></div></div>
        <div class="page-actions">
          <wa-input id="sketches-search" placeholder="Search sketches…" with-clear size="medium"></wa-input>
          <wa-button id="sketches-new" variant="brand">New sketch</wa-button>
        </div>
      </div>
      <div class="toolbar">
        <div class="seg" id="sketches-filter">
          <button class="on" data-filter="all">All</button>
          <button data-filter="evolved">Evolved</button>
          <button data-filter="forks">Forks</button>
          <button data-filter="snapshots">Snapshots</button>
          <button data-filter="calibration">Calibration</button>
        </div>
        <span class="spacer"></span>
        <span class="count" id="sketches-count"></span>
      </div>
      <div id="sketches-families"></div>
    </main>
    <script type="module" src="/src/sketchesPage.ts"></script>
  </body>
</html>
