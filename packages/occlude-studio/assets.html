<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>occlude assets</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="docs-body">
    <header id="topbar">
      <span class="wordmark">occlude<span class="wordmark-dot">·</span>assets</span>
      <div class="topbar-actions">
        <button id="btn-upload" title="Upload SVGs or images">Upload</button>
        <a class="topbar-link" href="/" rel="noopener">Studio</a>
        <a class="topbar-link" href="/docs.html" rel="noopener">Docs</a>
      </div>
    </header>
    <main id="assets-main">
      <p id="assets-hint" class="assets-hint">
        Drop files anywhere or press Upload. Reference by literal name in a sketch:
        <code>svg(asset('name.svg'), …)</code> for vectors,
        <code>image('name.png', { x, y, width })</code> to sample pixels (never drawn).
      </p>
      <div id="assets-grid" class="assets-grid"></div>
    </main>
    <script type="module" src="/src/assetsPage.ts"></script>
  </body>
</html>
