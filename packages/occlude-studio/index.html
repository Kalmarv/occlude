<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>occlude studio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <a class="icon-btn topbar-home" href="/sketches.html" title="Sketches — the library" aria-label="Sketches">
          <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M3 11.5 12 4l9 7.5" /><path d="M5.5 10v10h13V10" /><path d="M10 20v-6h4v6" />
          </svg>
        </a>
        <span class="wordmark">occlude<span class="wordmark-dot">·</span>studio</span>
        <input id="sketch-title" class="sketch-title" placeholder="untitled sketch" spellcheck="false" />
        <div class="topbar-actions">
          <button id="btn-save-top" class="icon-btn" title="Save (Ctrl+S)" aria-label="Save">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z" /><path d="M8 4v5h7V4" /><path d="M8 20v-6h8v6" /></svg>
          </button>
          <button id="btn-snapshot" class="icon-btn" title="Snapshot — freeze this source with the current seed" aria-label="Snapshot">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z" /><circle cx="12" cy="13" r="3.5" /></svg>
          </button>
          <button id="btn-fork" class="icon-btn" title="Fork — copy this sketch into a new one and keep going there" aria-label="Fork">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="5" r="2.2" /><circle cx="18" cy="5" r="2.2" /><circle cx="12" cy="19" r="2.2" /><path d="M6 7.5v2a4 4 0 0 0 4 4h4a4 4 0 0 0 4-4v-2" /><path d="M12 13.5v3" /></svg>
          </button>
          <button id="btn-evolve" class="icon-btn" title="Evolve — choose among variations of this drawing" aria-label="Evolve">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3 4 3 8 0 12" /><path d="M12 3c-3 4-3 8 0 12" /><path d="M12 15v6" /><path d="M6 8c2 0 4 1 6 3M18 8c-2 0-4 1-6 3" /></svg>
          </button>
          <a class="topbar-link" href="/fills.html" target="_blank" rel="noopener">Fills</a>
          <a class="topbar-link" href="/assets.html" target="_blank" rel="noopener">Assets</a>
          <a class="topbar-link" href="/machine.html" target="_blank" rel="noopener">Machine</a>
          <a class="topbar-link" href="/docs.html" target="_blank" rel="noopener">Docs</a>
        </div>
        <button id="btn-rail" class="icon-btn" title="Show or hide the panels" aria-pressed="true" aria-label="Panels">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" /><path d="M15 4v16" /></svg>
          </svg>
        </button>
      </header>
      <main id="workbench">
        <section id="editor-pane">
          <div id="editor"></div>
        </section>
        <div id="editor-resizer" role="separator" aria-orientation="vertical"
             title="Drag to resize the editor"></div>
        <section id="bench">
          <canvas id="preview"></canvas>
          <div id="bench-hud">
            <button id="btn-plot" title="Simulate the plot on screen — tour order at real feed rates">▶ Simulate</button>
            <select id="plot-speed" title="Plot speed multiplier">
              <option value="1">1×</option>
              <option value="5">5×</option>
              <option value="20" selected>20×</option>
              <option value="100">100×</option>
            </select>
            <button id="btn-fit" title="Fit paper to view">Fit</button>
            <details class="hud-menu" id="debug-menu">
              <summary title="Debug layers">Debug</summary>
              <div class="hud-menu-body">
                <label><input type="checkbox" id="dbg-occluded" /> occluded</label>
                <label><input type="checkbox" id="dbg-bridges" /> bridges</label>
                <label><input type="checkbox" id="dbg-cuts" /> cuts</label>
              </div>
            </details>
          </div>
        </section>
        <div id="rail-resizer" title="Drag to resize the panels — double-click to reset"></div>
        <aside id="rail"></aside>
      </main>
      <footer id="statusbar">
        <button id="render-toggle" title="Toggle sketch rendering (auto-pauses after a crashed run)"></button>
        <span id="status-msg" class="status-ok">ready</span>
        <span id="status-stats"></span>
        <span id="status-seed"></span>
        <span id="status-build" title="Build: commit and time. A '+' means uncommitted changes were in the tree."></span>
      </footer>
    </div>
    <input type="file" id="file-input" accept=".ts,.js,.txt" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
