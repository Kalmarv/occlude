name: occlude-3d
services:
  dev:
    profiles:
      - dev
    build:
      context: /home/kalmarv/containers/occlude-3d
      dockerfile: Dockerfile
      args:
        OCCLUDE_BUILD_STAMP: docker
      target: dev
    command:
      - pnpm
      - --filter
      - occlude-studio
      - exec
      - vite
      - preview
      - --host
      - 0.0.0.0
      - --port
      - "5273"
      - --strictPort
    environment:
      OCCLUDE_DEV_HOSTS: dev-occlude.ivyhq.xyz,occlude-dev.ivyhq.xyz,dev.occlude.ivyhq.xyz
    image: occlude-3d-dev:latest
    network_mode: host
    volumes:
      - type: bind
        source: /home/kalmarv/containers/occlude-3d/packages/occlude/src
        target: /src/packages/occlude/src
        bind: {}
      - type: bind
        source: /home/kalmarv/containers/occlude-3d/packages/occlude-studio/src
        target: /src/packages/occlude-studio/src
        bind: {}
      - type: bind
        source: /home/kalmarv/containers/occlude-3d/docs
        target: /src/docs
        bind: {}
      - type: bind
        source: /home/kalmarv/containers/occlude-3d/packages/occlude-studio/dev-store/sketches
        target: /src/packages/occlude-studio/sketches
        bind: {}
      - type: bind
        source: /home/kalmarv/containers/occlude-3d/packages/occlude-studio/dev-store/fills
        target: /src/packages/occlude-studio/fills
        bind: {}
      - type: bind
        source: /home/kalmarv/containers/occlude-3d/packages/occlude-studio/dev-store/assets
        target: /src/packages/occlude-studio/assets
        bind: {}
      - type: bind
        source: /home/kalmarv/containers/occlude-3d/packages/occlude-studio/dev-store/results
        target: /src/packages/occlude-studio/results
        bind: {}
  studio:
    build:
      context: /home/kalmarv/containers/occlude-3d
      dockerfile: Dockerfile
      args:
        OCCLUDE_BUILD_STAMP: docker
      target: studio
    environment:
      HOST: 0.0.0.0
      PORT: "4173"
    image: occlude-studio:latest
    network_mode: host
    restart: unless-stopped
    volumes:
      - type: bind
        source: /home/kalmarv/containers/occlude-3d/packages/occlude-studio/sketches
        target: /app/sketches
        bind: {}
      - type: bind
        source: /home/kalmarv/containers/occlude-3d/packages/occlude-studio/fills
        target: /app/fills
        bind: {}
      - type: bind
        source: /home/kalmarv/containers/occlude-3d/packages/occlude-studio/assets
        target: /app/assets
        bind: {}
      - type: bind
        source: /home/kalmarv/containers/occlude-3d/packages/occlude-studio/results
        target: /app/results
        bind: {}
